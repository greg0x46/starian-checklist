name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, xmlwriter, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verificar estilo
        run: ./vendor/bin/pint --test

      - name: Executar testes
        run: php artisan test

      - name: Auditar dependências
        run: composer audit

      - name: Garantir que a suíte não altera dados versionados
        run: git diff --exit-code

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção
        run: npm run build

      - name: Executar testes
        run: npm run test:ci

      - name: Auditar dependências de produção
        run: npm audit --omit=dev

      - name: Auditar dependências de desenvolvimento (informativo)
        run: npm audit || true

  smoke:
    name: Smoke em navegador (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, xmlwriter, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Instalar dependências do backend
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar Playwright e o navegador
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Executar o smoke
        working-directory: e2e
        run: npm test

      - name: Publicar evidências da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7

  compose:
    name: Ambiente do Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar a composição
        run: docker compose config --quiet

      - name: Construir as imagens
        run: docker compose build

      - name: Preparar o ambiente
        run: |
          cp backend/.env.example backend/.env
          touch backend/database/database.sqlite
          docker compose run --rm laravel php artisan key:generate
          docker compose run --rm laravel php artisan migrate --force

      - name: Subir os serviços e esperar os healthchecks
        run: docker compose up -d --wait --wait-timeout 300

      - name: Consultar os dois serviços
        run: |
          curl -fsS http://localhost:8000/api/tarefas
          curl -fsS -o /dev/null http://localhost:4200

      - name: Conferir as versões em execução
        run: |
          docker compose exec -T laravel php artisan --version
          docker compose exec -T angular node -e \
            "console.log('Angular', require('/frontend/node_modules/@angular/core/package.json').version)"

      - name: Publicar logs em caso de falha
        if: failure()
        run: docker compose logs --no-color

      - name: Derrubar o ambiente
        if: always()
        run: docker compose down -v
